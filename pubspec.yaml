name: routine
description: Um app para planejamento de rotinas.
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localização
  intl: ^0.20.2                         # alinhado ao flutter_localizations do SDK atual

  # Estado
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0

  # Auth social
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0
  # flutter_signin_button removido — lib abandonada desde 2021, faça os botões manualmente

  # Persistência local (cache/offline)
  sqflite: ^2.3.3
  sqlite3: ^2.9.4
  path_provider: ^2.1.3

  # Preferências
  shared_preferences: ^2.2.2

  # Compras in-app
  in_app_purchase: ^3.1.6

  # Contatos & permissões
  flutter_contacts: ^2.0.2
  permission_handler: ^12.0.1

  # Mídia
  image_picker: ^1.0.4

  # Notificações
  flutter_local_notifications: ^21.0.0

  # Rede
  http: ^1.2.1                          # era ^0.13.6 — atualizado para versão estável atual

  # Utilitários
  uuid: ^4.5.1
  crypto: ^3.0.3
  cupertino_icons: ^1.0.2

  path: ^1.9.1
  timezone: ^0.11.0
  add_2_calendar: 3.0.1
  firebase_messaging: ^16.5.0
  google_fonts: ^8.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Geração de assets/localização
  flutter_gen_runner: ^5.4.0            # adicionado — necessário para flutter_gen funcionar

  # Ícone & splash
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

  # Testes
  fake_cloud_firestore: ^4.1.0+1
  sqflite_common_ffi: ^2.3.4+4

flutter:
  uses-material-design: true
  generate: true

flutter_gen:
  integrations:
    flutter_localizations:
      enabled: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_v2.png"
  adaptive_icon_foreground: "assets/images/app_icon_adaptive_foreground_v2.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_background: "#0B3B66"
  adaptive_icon_monochrome: "assets/images/app_icon_monochrome_v2.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/app_icon_v2.png"
    background_color: "#0B3B66"
    theme_color: "#0B3B66"
  windows:
    generate: true
    image_path: "assets/images/app_icon_v2.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/app_icon_v2.png"

flutter_native_splash:
  color: "#0B3B66"
  color_dark: "#0B3B66"
  image: assets/images/app_icon_adaptive_foreground_v2.png
  image_dark: assets/images/app_icon_adaptive_foreground_v2.png
  android: true
  ios: true
  android_12:
    image: assets/images/app_icon_adaptive_foreground_v2.png
    image_dark: assets/images/app_icon_adaptive_foreground_v2.png
    color: "#0B3B66"
    color_dark: "#0B3B66"
    icon_background_color: "#0B3B66"
    icon_background_color_dark: "#0B3B66"
